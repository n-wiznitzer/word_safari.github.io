<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Safari</title>
<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

.pic{font-size:5.5rem;line-height:1.1}

.tl{padding:14px 0;font-size:1.8rem;text-transform:uppercase}

.bb{left:25px;top:0;width:100px;height:68px;background:#fff;border:4px solid #8a8a8a;border-radius:8px}
.bb::after{content:"";position:absolute;left:50%;bottom:6px;width:38px;height:26px;margin-left:-19px;border:4px solid var(--r);border-radius:3px}

.gl{color:#d49a00;font-size:1.2rem}
body.goldr{box-shadow:inset 0 0 70px 14px #ffd93d}

@keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}
.coach{font-size:3rem;animation:bn .5s 3}
.clk{font-size:1.7rem;background:#222;color:#ffd93d;padding:2px 20px;border-radius:10px;font-family:"Courier New",monospace;letter-spacing:3px}
.hoop.sw .net{animation:sw .5s}.free .bl{z-index:4}.free .bl.ok{background:none;border:0}
@keyframes dk{0%{transform:translate(55px,-8px)}45%{transform:translate(0,40px)}100%{transform:translate(0,96px)}}
@keyframes sw{50%{transform:scale(1.2,1.12)}}

.bl{background:none;font-size:3.6rem;position:relative;width:96px;height:96px;border-radius:50%}
.bl span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;text-shadow:0 2px 2px #000,0 0 4px #000}
.steal .bl{position:absolute;left:0;top:calc(var(--i)*84px);animation:run 6s linear infinite;animation-delay:calc(var(--i)*-2.2s)}
@keyframes run{from{transform:translateX(-100px)}to{transform:translateX(560px)}}
.ball{font-size:5.5rem;background:none;position:relative;animation:bn .8s ease-in-out infinite}
.ball em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.2rem;color:#fff;font-style:normal;text-shadow:0 2px 3px #000}
.ball.gold{filter:sepia(1) saturate(6) hue-rotate(-12deg) brightness(1.2) drop-shadow(0 0 12px gold)}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
.yn .opt{font-size:3rem}
.pr{display:inline-flex;align-items:flex-end;justify-content:center;gap:.15em;font-size:.85em}.pr.tr{font-size:.55em}
.pr i{display:flex;flex-direction:column;align-items:center;font-style:normal;line-height:1.1}
.pr u{text-decoration:none;font-size:.5em;line-height:1}.pr s{display:inline-block;text-decoration:none}
.f{transform:scaleX(1.6);margin:0 .25em}.n{transform:scaleX(.55);margin:0 -.1em}.sm{font-size:.6em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.cd{background:var(--card);border-radius:18px;padding:10px 4px;font-size:2.2rem;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.cd small{display:block;font-size:.8rem}.cd.lk{opacity:.45}
.win{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center;background:linear-gradient(135deg,#ff6b9d,#ffd93d,#6bcf7f,#4dabf7,#b57cff);background-size:400% 400%;animation:bg 4s linear infinite;z-index:5}
@keyframes bg{50%{background-position:100% 100%}}
.win h1{color:#fff;font-size:2.6rem;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.win .card{background:#fff;color:#3a2412;border-radius:28px;padding:24px 40px;font-size:6rem;animation:pop .8s cubic-bezier(.3,1.8,.5,1);display:flex;flex-direction:column}
.win .card b{font-size:1.8rem}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
@media (prefers-reduced-motion:reduce){.hero,.ball,.win,.gw i,body.goldr #app{animation:none}}

view(hd+`<div class="c arena"><h2>${T}</h2>${ty=="free"?"<div class=hoop><i class=bb></i><i class=rim></i><i class=net></i></div>":""}${ty=="whistle"?`<div class=coach>🧑‍🏫📣</div><div class=pic>${w.p}</div><div class=clk>10</div><p>What is it? Tap the word before the clock ends!</p>`:"<button class=spk>🔊</button>"}<div class="court ${ty}">${o.map((x,i)=>`<button class=bl style="--i:${i}">🏀<span>${x.w}</span></button>`).join("")}</div></div>`);
const s=$(".spk");if(s){s.onclick=()=>say(w.w);say(w.w)}
if(ty=="whistle"){let n=10;const c=$(".clk");whistle();const iv=setInterval(()=>{if(!c.isConnected||!live)return clearInterval(iv);n--;c.textContent=n;if(n<=0){whistle();n=10;c.textContent="Time! 10";setTimeout(()=>{if(c.isConnected&&live)c.textContent=10},900)}},1000)}
app.querySelectorAll(".bl").forEach((b,i)=>b.onclick=()=>{const ok=o[i]==w;if(ok)live=0;
if(ty=="free"){const r=$(".rim").getBoundingClientRect(),g=b.getBoundingClientRect(),dx=r.left+r.width/2-g.left-g.width/2,dy=r.top+r.height/2-g.top-g.height/2;
if(ok){b.style.zIndex=9;b.animate([{transform:"none"},{transform:`translate(${dx*.6}px,${dy-70}px) scale(.7)`,offset:.55},{transform:`translate(${dx}px,${dy+14}px) scale(.4)`}],{duration:900,easing:"ease-out",fill:"forwards"});setTimeout(()=>{$(".hoop").classList.add("sw");ding()},700)}
else b.animate([{transform:"none"},{transform:`translate(${dx*.7}px,${dy*.8}px) scale(.6)`},{transform:"none"}],{duration:600})}
ans(ok,b,w,ok&&ty=="free"?()=>setTimeout(done,500):done)})};
if(cur.sd){run();if(gold)gstart()}
else{cur.sd=1;view(hd+`<div class=c><h2>A surprise!</h2><p>Tap the ball</p><button class="ball${gold?" gold":""}" id=sb>🏀<em>?</em></button></div>`);$("#sb").onclick=()=>{ding();run();if(gold)gstart()}}}

function fin(){const ul=[];cur.ws.forEach(w=>{const p=P(w.w);p.n++;if(!cur.err[w.w])p.s++;if(p.s>=5&&!p.m){p.m=1;ul.push(w)}});save();unl(ul)}
function unl(ul){if(!ul.length)return end();const w=ul.shift();clap();
view(`<div class=win><div class=card>${w.p}<b>${w.w}</b></div><h1>Ori Is The King!!!</h1><button class=big>Next</button></div>`);$(".win button").onclick=()=>unl(ul)}
function end(){view(`<div class=c><div class=hero>🎉</div><h2>Great job!</h2>${cur.ws.map(w=>`<p>${w.p} ${w.w} &nbsp;${"●".repeat(Math.min(P(w.w).s,5))}${"○".repeat(5-Math.min(P(w.w).s,5))}</p>`).join("")}<button class=big id=a>Start another session</button><button class="big alt" id=b>That's all for now</button></div>`);$("#a").onclick=start;$("#b").onclick=home}

function showError(message){let el=$("#db-error");if(!el){el=document.createElement("p");el.id="db-error";el.style.cssText="color:#b42318;font-size:.95rem;max-width:100%;overflow-wrap:anywhere";app.prepend(el);}el.textContent=message;}
// Supabase Auth requires an email or phone. This app maps each username to a
// synthetic email address; disable email confirmations in Supabase Auth settings.
const usernameToAuthEmail = username => `${username.trim().toLowerCase()}@word-safari-login.com`;
const validUsername = username => /^[a-zA-Z0-9_.-]{3,24}$/.test(username);
function authScreen(message="Sign in with your username and password"){
  document.body.classList.remove("goldr");
  view(`<div class="c"><div class="hero">🦁</div><h1>Word Safari</h1><p>${message}</p><form id="auth-form" style="width:100%;display:grid;gap:12px"><input id="username" type="text" autocomplete="username" placeholder="Username (3–24 characters)" minlength="3" maxlength="24" required pattern="[A-Za-z0-9_.-]{3,24}" style="padding:14px;border-radius:14px;border:2px solid #d8c6a8;font:inherit"><input id="password" type="password" autocomplete="current-password" placeholder="Password (at least 6 characters)" minlength="6" required style="padding:14px;border-radius:14px;border:2px solid #d8c6a8;font:inherit"><input id="learner-name" type="text" placeholder="Learner name (for new account)" maxlength="80" style="padding:14px;border-radius:14px;border:2px solid #d8c6a8;font:inherit"><button class="big" type="submit">Sign in</button><button class="big alt" type="button" id="signup">Create account</button></form><p style="font-size:.85rem;font-weight:500">Usernames may contain letters, numbers, dots, dashes and underscores. Ask your parent to keep your username and password safe.</p></div>`);
  $("#auth-form").onsubmit=async e=>{
    e.preventDefault();
    const username=$("#username").value.trim().toLowerCase(),password=$("#password").value;
    if(!validUsername(username)){showError("Use 3–24 letters, numbers, dots, dashes or underscores for your username.");return;}
    const {error}=await sb.auth.signInWithPassword({email:usernameToAuthEmail(username),password});
    if(error)showError("Sign-in failed. Check your username and password.");else await init();
  };
  $("#signup").onclick=async()=>{
    const username=$("#username").value.trim().toLowerCase(),password=$("#password").value,name=$("#learner-name").value.trim();
    if(!validUsername(username)){showError("Choose a username with 3–24 letters, numbers, dots, dashes or underscores.");return;}
    if(password.length<6){showError("Choose a password with at least 6 characters.");return;}
    const {data,error}=await sb.auth.signUp({email:usernameToAuthEmail(username),password,options:{data:{username,learner_name:name||username}}});
    if(error){showError(error.message.includes("already registered")||error.message.includes("already been registered")?"That username may already be taken. Try another one.":error.message);return;}
    if(!data.session){showError("Account created, but Supabase requires email confirmation. Disable Confirm email in Supabase Auth settings for this username-only login setup, then try again.");return;}
    await init();
  };
}
async function loadAppData(){
  const {data:authData,error:authError}=await sb.auth.getUser();if(authError)throw authError;dbUser=authData.user;if(!dbUser){authScreen();return false;}
  const {data:themes,error:themeErr}=await sb.from("dim_themes").select("id,name");if(themeErr)throw themeErr;
  const basketball=(themes||[]).find(t=>t.name.toLowerCase()==="basketball");
  let {data:profiles,error:profileErr}=await sb.from("dim_users").select("*").eq("auth_user_id",dbUser.id).limit(1);if(profileErr)throw profileErr;
  profile=profiles&&profiles[0];
  if(!profile){const {data:created,error:createErr}=await sb.from("dim_users").insert({auth_user_id:dbUser.id,name:dbUser.user_metadata?.learner_name||dbUser.user_metadata?.username||"Learner",username:dbUser.user_metadata?.username||dbUser.email?.split("@")[0]||"learner",theme_id:basketball?.id??null,card_level:1,activity_level:1,gold_stars:0}).select("*").single();if(createErr)throw createErr;profile=created;}
  const [cardRes,activityRes,stickerRes,progressRes,stickerProgressRes,levelRes]=await Promise.all([
    sb.from("dim_cards").select("id,word,emoji,category,level,pic_type,pic_data").order("id"),
    sb.from("dim_activities").select("id,name,start_level,end_level,theme_activity").order("id"),
    sb.from("dim_stickers").select("id,name,emoji").order("id"),
    sb.from("fact_user_cards").select("card_id,sessions_complete,correct_streak,is_mastered").eq("user_id",profile.id),
    sb.from("fact_user_stickers").select("sticker_id,sticker_count").eq("user_id",profile.id),
    sb.from("dim_levels").select("id,name").order("id")
  ]);
  for(const r of [cardRes,activityRes,stickerRes,progressRes,stickerProgressRes,levelRes])if(r.error)throw r.error;
  activities=activityRes.data||[];stickerRows=stickerRes.data||[];levels=levelRes.data||[];
  ALL=(cardRes.data||[]).filter(c=>!c.level||!profile.card_level||c.level<=profile.card_level).map(c=>({id:c.id,w:c.word,p:cardPic(c),k:c.category||"general",level:c.level,pic_type:c.pic_type,pic_data:c.pic_data}));
  if(!ALL.length)throw new Error("No vocabulary cards were returned from dim_cards. Seed dim_cards first and ensure the authenticated user can read it.");
  D={};ALL.forEach(c=>{D[c.k]=true;});
  S={p:{},g:profile.gold_stars||0,st:{}};
  const cardById=new Map(ALL.map(c=>[String(c.id),c]));
  (progressRes.data||[]).forEach(r=>{const c=cardById.get(String(r.card_id));if(c)S.p[c.w]={n:r.sessions_complete||0,s:r.correct_streak||0,m:r.is_mastered?1:0};});
  const stickerById=new Map(stickerRows.map(x=>[String(x.id),x]));
  (stickerProgressRes.data||[]).forEach(r=>{const st=stickerById.get(String(r.sticker_id));if(st)S.st[st.emoji]=r.sticker_count||0;});
  STK=stickerRows.map(x=>x.emoji).filter(Boolean);
  if(!STK.length)STK=["🏆","🥇","👑","🏀","🔥","🏅","🎯","💎"];
  return true;
}
async function init(){
  try{if(SUPABASE_URL.startsWith("YOUR_")||SUPABASE_ANON_KEY.startsWith("YOUR_")){authScreen("Add your Supabase URL and anon key in the HTML first.");return;}const ready=await loadAppData();if(ready)home();}
  catch(e){console.error(e);authScreen("Could not load Word Safari from the database.");showError(e.message||"Database connection failed. Check Supabase settings, schema and RLS policies.");}
}
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){dbUser=null;profile=null;authScreen();}});
init();
